<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ZCODE · Документ</title>
    <link rel="stylesheet" href="./panel.css" />
    <link rel="stylesheet" href="./pane.css" />
    <!--HOST_SCRIPT-->
    <script type="module" src="./bootstrap.js"></script>
  </head>
  <body>
    <header class="toolbar">
      <img src="./icon.png" class="brand" alt="ZCODE" />
      <div class="heading">
        <strong id="title" class="text-ui-base">ZCODE</strong
        ><span id="host" class="text-ui-sm">Документ</span>
      </div>
      <button id="theme" class="icon" title="Сменить тему" aria-label="Сменить тему">◐</button>
    </header>
    <details id="connection" open>
      <summary id="connection-state" class="text-ui-sm">ZCODE не подключён</summary>
      <form id="connect-form" class="connection-fields">
        <label class="text-ui-sm"
          >Канал
          <input id="endpoint" class="text-ui-base" value="wss://localhost:43485/document" required
        /></label>
        <label class="text-ui-sm"
          >Папка проекта
          <input id="workspace" class="text-ui-base" placeholder="D:\Development\Project" required
        /></label>
        <label class="text-ui-sm"
          >Код подключения
          <input id="token" class="text-ui-base" type="password" autocomplete="off" required
        /></label>
        <span class="text-ui-sm"
          >При первом подключении Office сохранит идентификатор в метаданных документа.</span
        >
        <div>
          <button type="submit" class="outline text-ui-caption">Подключить</button>
          <button type="button" id="disconnect" class="outline text-ui-caption">Отключить</button>
        </div>
      </form>
    </details>
    <nav class="tabs" aria-label="Беседы">
      <button id="document-tab" class="active text-ui-base">Документ</button>
      <button id="side" class="text-ui-base" title="Наследует историю текущей беседы">
        Side conversation
      </button>
      <button id="discussion-tab" class="text-ui-base">Обсуждения</button>
    </nav>
    <section class="selection">
      <div class="section-label text-ui-sm">
        <span id="selection-label">Выделение</span
        ><button id="read" class="link text-ui-sm">Взять выделение</button>
      </div>
      <blockquote id="quote" class="text-ui-base">Выделите фрагмент в документе.</blockquote>
      <button
        id="discuss"
        class="outline text-ui-caption"
        title="Новая сессия без истории текущей беседы"
      >
        Обсудить без истории ↗
      </button>
      <button id="locate" class="outline text-ui-caption">Показать в документе</button>
      <p id="status" class="text-ui-sm" role="status">
        Можно читать документ без подключения к модели.
      </p>
    </section>
    <section id="threads" class="threads" hidden aria-label="Беседы документа"></section>
    <section id="recovery" aria-label="Подтверждения команд"></section>
    <main id="messages" class="messages" aria-live="polite"></main>
    <section id="proposals" class="proposals" aria-label="Предложения правок"></section>
    <footer>
      <form id="composer" class="composer">
        <div id="context" class="context text-ui-sm">Документ</div>
        <textarea
          id="prompt"
          class="text-ui-base"
          rows="3"
          placeholder="Спросите ZCODE…"
          aria-label="Сообщение"
        ></textarea>
        <div class="composer-actions">
          <button
            type="button"
            id="add-context"
            class="icon"
            title="Добавить выделение"
            aria-label="Добавить выделение"
          >
            ＋
          </button>
          <select id="mode" class="text-ui-sm" aria-label="Режим агента">
            <option value="build">Ask before changes</option>
            <option value="plan">Plan</option>
            <option value="yolo">Full access</option>
          </select>
          <span id="model" class="model text-ui-sm">Модель ZCODE</span>
          <button
            type="button"
            id="stop"
            class="icon"
            title="Остановить текущую работу"
            aria-label="Остановить"
            hidden
          >
            ■
          </button>
          <button type="submit" id="send" class="send" title="Отправить" aria-label="Отправить">
            ↑
          </button>
        </div>
      </form>
      <p class="footnote text-ui-xs">
        История и исполнение — в ZCODE. Правки применяются после проверки.
      </p>
    </footer>
  </body>
</html>
